[package]
name = "llm-wayvisuals"
version = "0.1.0"
edition = "2021"
description = "Sci-fi 1920x480 sensor panels for llm-visuals stats (Linux, Wayland and X11)"
license = "MIT"
repository = "https://github.com/Pix13/llm-wayvisuals"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
# render
tiny-skia = "0.12"
ab_glyph = "0.2"
winit = "0.30.13"
softbuffer = "0.4.8"
signal-hook = "0.4.6"
clap = { version = "4.6.7", features = ["derive"] }
# wayland (frontend task)
# smithay-client-toolkit = "0.21"

[profile.release]
lto = "thin"
